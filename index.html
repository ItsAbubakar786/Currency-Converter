<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency-Converter</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h1>Currency Converter</h1>
      <!-- <span>Live Exchange Rates</span> -->
      <!-- theme toggle -->
      <div class="theme-toggle">
        <button class="toggle-btn">
          <i class="fa-solid fa-sun sun-icon"></i>
          <span class="toggle-circle"></span>
          <i class="fa-solid fa-moon moon-icon"></i>
        </button>
      </div>
      <form>
        <div class="amount">
          <p>Enter Amount:</p>
          <input value="1" type="number" placeholder="Enter Amount" />
        </div>

        <!--quick amount -->

        <div class="quick-amounts">
          <p>Quick Amounts:</p>
          <!-- <span>10</span> -->
          <span>100</span>
          <span>500</span>
          <span>1000</span>
        </div>

        <div class="dropdown">
          <div class="from">
            <p>From:</p>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" alt="US Flag" />
              <select name="from"></select>
            </div>
          </div>
          <i class="arrow fa-solid fa-arrow-right-arrow-left"></i>
          <div class="to">
            <p>To:</p>
            <div class="select-container">
              <img src="https://flagsapi.com/IN/flat/64.png" alt="IN Flag" />
              <select name="to"></select>
            </div>
          </div>
        </div>

        <p>Exchange Rate:</p>
        <div class="msg">
          <span>1USD = 82.74 INR</span>
        </div>
        <button class="exchange-btn">Get Exchange Rate</button>
      </form>
    </div>
    <script src="codes.js"></script>
    <script src="script.js"></script>
  </body>
</html>
